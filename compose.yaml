services:
  candidate-service:
    build: .
    environment:
      PROVIDER_URL: http://provider-simulator:8081
      DB_NAME: candidate
      DB_USER: candidate
      DB_PASSWORD: candidate
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy


  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    depends_on:
      - candidate-service


  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: candidate
      POSTGRES_PASSWORD: candidate
      POSTGRES_DB: candidate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: